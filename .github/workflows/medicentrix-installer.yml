name: Build Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Organize application files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path @('electron','build','web','web/assets') | Out-Null

          Copy-Item -Path 'main.cjs' -Destination 'electron/main.cjs'
          Copy-Item -Path 'icon.ico' -Destination 'build/icon.ico'

          Copy-Item -Path @('index.html','app.js','styles.css','sw.js','manifest.webmanifest') -Destination 'web'

          Copy-Item -Path @('logo.svg','icon-192.png','icon-512.png') -Destination 'web/assets'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows EXE
        run: npm run build:win

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: MediCentrix-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
